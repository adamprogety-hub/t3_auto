<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(100, 35)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Conveyor Guide Rails -->
    <line x1="10" y1="140" x2="190" y2="140" stroke="#475569" stroke-width="1.8" />
    <line x1="10" y1="165" x2="190" y2="165" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Camera Mounting Rig Structure -->
    <path d="M40 140 L40 40 L160 40 L160 140" stroke="#94A3B8" stroke-dasharray="3 3" />
    
    <!-- Industrial High-Speed Camera Unit -->
    <rect x="85" y="28" width="30" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.4" />
    <!-- Camera Lens -->
    <rect x="94" y="52" width="12" height="8" rx="1" fill="#475569" />
    <circle cx="92" cy="38" r="2" fill="#E66826" stroke="none" />

    <!-- Optical Field of View (Laser Light Fan) -->
    <polygon points="94,60 106,60 155,135 45,135" fill="#E66826" fill-opacity="0.06" stroke="#E66826" stroke-dasharray="2 2" stroke-width="0.9" />

    <!-- Inspected Part on Conveyor (Car Seat Frame) -->
    <rect x="70" y="115" width="60" height="25" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.3" />
    <circle cx="85" cy="127" r="4" fill="#FFFFFF" stroke="#64748B" />
    <circle cx="115" cy="127" r="4" fill="#FFFFFF" stroke="#64748B" />

    <!-- CV Bounding Box Target Frame -->
    <rect x="62" y="107" width="76" height="38" rx="1" stroke="#10B981" stroke-width="1.4" stroke-dasharray="4 2" />
    <!-- Crosshairs on Inspected Node -->
    <line x1="85" y1="120" x2="85" y2="134" stroke="#10B981" stroke-width="1.2" />
    <line x1="78" y1="127" x2="92" y2="127" stroke="#10B981" stroke-width="1.2" />
    
    <!-- Status Dot -->
    <circle cx="145" cy="102" r="3" fill="#10B981" stroke="none" />
  </g>
</svg>