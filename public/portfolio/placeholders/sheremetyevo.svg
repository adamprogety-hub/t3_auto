<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(110, 40)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pumping Unit 1 (Left) -->
    <circle cx="45" cy="115" r="24" fill="#E2E8F0" stroke="#475569" stroke-width="1.4" />
    <circle cx="45" cy="115" r="9" fill="#F4F6F8" stroke="#64748B" />
    <path d="M45 91 L45 65 L75 65" />
    <path d="M21 115 L5 115 L5 145 L75 145" />
    <!-- Valve on Pump 1 -->
    <polygon points="40,75 50,75 40,85 50,85" fill="#CBD5E1" stroke="#64748B" />

    <!-- Pumping Unit 2 (Right) -->
    <circle cx="135" cy="115" r="24" fill="#E2E8F0" stroke="#475569" stroke-width="1.4" />
    <circle cx="135" cy="115" r="9" fill="#F4F6F8" stroke="#64748B" />
    <path d="M135 91 L135 65 L105 65" />
    <path d="M159 115 L175 115 L175 145 L105 145" />
    <!-- Valve on Pump 2 -->
    <polygon points="130,75 140,75 130,85 140,85" fill="#CBD5E1" stroke="#64748B" />

    <!-- Manifold Connection -->
    <line x1="75" y1="65" x2="105" y2="65" stroke-width="1.6" stroke="#475569" />
    <line x1="90" y1="65" x2="90" y2="35" stroke-width="1.6" stroke="#475569" />
    
    <!-- Pressure Sensor Indicator -->
    <circle cx="90" cy="25" r="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" />
    <line x1="90" y1="28" x2="94" y2="22" stroke="#E66826" stroke-width="1.4" />
    <path d="M90 33 L90 35" />

    <!-- VFD Controller Schematic (Top-Left) -->
    <rect x="-10" y="20" width="32" height="42" rx="3" fill="#FFFFFF" stroke="#475569" />
    <line x1="-5" y1="32" x2="17" y2="32" stroke="#CBD5E1" />
    <circle cx="6" cy="45" r="3" fill="#E66826" stroke="none" />
    <path d="M6 62 L6 90 L21 115" stroke-dasharray="2 2" stroke="#E66826" opacity="0.7" />

    <!-- Suction Header -->
    <line x1="75" y1="145" x2="105" y2="145" stroke-width="1.6" stroke="#475569" />
    <line x1="90" y1="145" x2="90" y2="160" stroke-width="1.6" stroke="#475569" />
  </g>
</svg>