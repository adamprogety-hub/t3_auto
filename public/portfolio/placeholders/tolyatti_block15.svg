<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(105, 45)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Chassis / DIN Rail -->
    <rect x="0" y="35" width="190" height="95" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.4" />
    <line x1="0" y1="52" x2="190" y2="52" stroke="#E2E8F0" />
    <line x1="0" y1="112" x2="190" y2="112" stroke="#E2E8F0" />

    <!-- Redundant CPU A (SIL3) -->
    <rect x="12" y="42" width="28" height="62" rx="2" fill="#E2E8F0" stroke="#475569" />
    <circle cx="26" cy="54" r="2.5" fill="#E66826" stroke="none" />
    <line x1="18" y1="68" x2="34" y2="68" stroke="#94A3B8" />
    <line x1="18" y1="74" x2="34" y2="74" stroke="#94A3B8" />
    <line x1="18" y1="80" x2="34" y2="80" stroke="#94A3B8" />

    <!-- Redundant CPU B (SIL3) -->
    <rect x="46" y="42" width="28" height="62" rx="2" fill="#E2E8F0" stroke="#475569" />
    <circle cx="60" cy="54" r="2.5" fill="#E66826" stroke="none" />
    <line x1="52" y1="68" x2="68" y2="68" stroke="#94A3B8" />
    <line x1="52" y1="74" x2="68" y2="74" stroke="#94A3B8" />
    <line x1="52" y1="80" x2="68" y2="80" stroke="#94A3B8" />

    <!-- Synchronization Bus Link -->
    <path d="M40 54 L46 54" stroke="#E66826" stroke-width="1.5" />

    <!-- I/O Modules Racks -->
    <rect x="84" y="42" width="18" height="62" rx="1" fill="#F8FAFC" stroke="#64748B" />
    <rect x="106" y="42" width="18" height="62" rx="1" fill="#F8FAFC" stroke="#64748B" />
    <rect x="128" y="42" width="18" height="62" rx="1" fill="#F8FAFC" stroke="#64748B" />
    <rect x="150" y="42" width="18" height="62" rx="1" fill="#F8FAFC" stroke="#64748B" />

    <!-- Status LEDs on I/O -->
    <circle cx="93" cy="52" r="1.5" fill="#10B981" stroke="none" />
    <circle cx="115" cy="52" r="1.5" fill="#10B981" stroke="none" />
    <circle cx="137" cy="52" r="1.5" fill="#10B981" stroke="none" />
    <circle cx="159" cy="52" r="1.5" fill="#10B981" stroke="none" />

    <!-- Terminal Wire Traces to Field -->
    <line x1="93" y1="104" x2="93" y2="145" stroke-dasharray="2 2" stroke="#94A3B8" />
    <line x1="115" y1="104" x2="115" y2="145" stroke-dasharray="2 2" stroke="#94A3B8" />
    <line x1="137" y1="104" x2="137" y2="145" stroke-dasharray="2 2" stroke="#94A3B8" />
    <line x1="159" y1="104" x2="159" y2="145" stroke-dasharray="2 2" stroke="#94A3B8" />
    
    <!-- Safety Loop Diamond Badge -->
    <polygon points="178,18 188,28 178,38 168,28" fill="#FFFFFF" stroke="#E66826" stroke-width="1.2" />
    <circle cx="178" cy="28" r="2" fill="#E66826" stroke="none" />
  </g>
</svg>