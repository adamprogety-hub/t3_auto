<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(125, 30)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tall Rectification Column Body -->
    <rect x="35" y="15" width="45" height="155" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.4" />
    
    <!-- Fractionating Trays / Bubble Plates -->
    <line x1="38" y1="40" x2="77" y2="40" stroke="#CBD5E1" stroke-dasharray="2 2" />
    <line x1="38" y1="60" x2="77" y2="60" stroke="#CBD5E1" stroke-dasharray="2 2" />
    <line x1="38" y1="80" x2="77" y2="80" stroke="#CBD5E1" stroke-dasharray="2 2" />
    <line x1="38" y1="100" x2="77" y2="100" stroke="#CBD5E1" stroke-dasharray="2 2" />
    <line x1="38" y1="120" x2="77" y2="120" stroke="#CBD5E1" stroke-dasharray="2 2" />
    <line x1="38" y1="140" x2="77" y2="140" stroke="#CBD5E1" stroke-dasharray="2 2" />

    <!-- Vapor Line from Top to Condenser -->
    <path d="M57 15 L57 5 L115 5 L115 35" stroke="#475569" stroke-width="1.4" />
    
    <!-- Overhead Condenser Coil Heat Exchanger -->
    <rect x="102" y="35" width="26" height="42" rx="3" fill="#E2E8F0" stroke="#475569" />
    <path d="M107 43 L123 47 L107 51 L123 55 L107 59 L123 63" stroke="#64748B" stroke-width="1" />

    <!-- Reflux Return Line to Column -->
    <path d="M115 77 L115 95 L80 95" stroke="#E66826" stroke-width="1.4" />
    <polygon points="98,90 108,90 98,100 108,100" fill="#CBD5E1" stroke="#475569" />

    <!-- Reboiler Steam Base (Bottom) -->
    <path d="M35 150 C20 150, 20 175, 35 175 L57 175" stroke="#475569" />
    <circle cx="15" cy="162" r="5" fill="#FFFFFF" stroke="#475569" />
    <line x1="15" y1="159" x2="15" y2="165" stroke="#E66826" stroke-width="1.3" />
  </g>
</svg>