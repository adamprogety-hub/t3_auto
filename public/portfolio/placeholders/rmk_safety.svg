<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(100, 45)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Dispatch Workstation Hub -->
    <circle cx="100" cy="70" r="30" fill="#FFFFFF" stroke="#475569" stroke-width="1.4" />
    <circle cx="100" cy="70" r="18" fill="#E2E8F0" stroke="#64748B" />
    <circle cx="100" cy="70" r="5" fill="#E66826" stroke="none" />

    <!-- Radiating Telemetry Links to Satellite Units -->
    <line x1="78" y1="48" x2="38" y2="24" stroke="#94A3B8" stroke-dasharray="3 3" />
    <line x1="122" y1="48" x2="162" y2="24" stroke="#94A3B8" stroke-dasharray="3 3" />
    <line x1="72" y1="80" x2="28" y2="105" stroke="#94A3B8" stroke-dasharray="3 3" />
    <line x1="128" y1="80" x2="172" y2="105" stroke="#94A3B8" stroke-dasharray="3 3" />
    <line x1="100" y1="100" x2="100" y2="140" stroke="#E66826" stroke-width="1.4" />

    <!-- Satellite Node 1 (Substation A) -->
    <rect x="18" y="12" width="24" height="20" rx="3" fill="#FFFFFF" stroke="#475569" />
    <circle cx="30" cy="22" r="2" fill="#10B981" stroke="none" />

    <!-- Satellite Node 2 (Substation B) -->
    <rect x="158" y="12" width="24" height="20" rx="3" fill="#FFFFFF" stroke="#475569" />
    <circle cx="170" cy="22" r="2" fill="#10B981" stroke="none" />

    <!-- Satellite Node 3 (Emergency Siren / Sensor) -->
    <rect x="12" y="98" width="24" height="20" rx="3" fill="#FFFFFF" stroke="#475569" />
    <circle cx="24" cy="108" r="2" fill="#10B981" stroke="none" />

    <!-- Satellite Node 4 (Gas Sensor Array) -->
    <rect x="164" y="98" width="24" height="20" rx="3" fill="#FFFFFF" stroke="#475569" />
    <circle cx="176" cy="108" r="2" fill="#10B981" stroke="none" />

    <!-- Alarm / Notification Server Node (Bottom) -->
    <rect x="80" y="136" width="40" height="22" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" />
    <line x1="86" y1="143" x2="114" y2="143" stroke="#CBD5E1" />
    <circle cx="100" cy="151" r="2" fill="#E66826" stroke="none" />
  </g>
</svg>