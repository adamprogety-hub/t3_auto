<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4F6F8" />
  <g transform="translate(105, 45)" stroke="#64748B" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Test Bench Cabinet Console -->
    <rect x="0" y="20" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.4" />
    
    <!-- Operator Monitor Screen -->
    <rect x="15" y="32" width="75" height="52" rx="2" fill="#F8FAFC" stroke="#64748B" />
    <!-- Bar Graph Display on Test Screen -->
    <rect x="23" y="60" width="7" height="16" fill="#CBD5E1" stroke="none" />
    <rect x="33" y="52" width="7" height="24" fill="#CBD5E1" stroke="none" />
    <rect x="43" y="44" width="7" height="32" fill="#E66826" stroke="none" />
    <rect x="53" y="56" width="7" height="20" fill="#CBD5E1" stroke="none" />
    <rect x="63" y="48" width="7" height="28" fill="#10B981" stroke="none" />

    <!-- Analog Gauge / Dynamometer Dial -->
    <circle cx="132" cy="58" r="24" fill="#F8FAFC" stroke="#475569" stroke-width="1.3" />
    <circle cx="132" cy="58" r="2.5" fill="#475569" />
    <line x1="132" y1="58" x2="143" y2="46" stroke="#E66826" stroke-width="1.6" />
    <!-- Dial Ticks -->
    <line x1="132" y1="38" x2="132" y2="42" stroke="#94A3B8" />
    <line x1="147" y1="44" x2="144" y2="47" stroke="#94A3B8" />
    <line x1="152" y1="58" x2="148" y2="58" stroke="#94A3B8" />

    <!-- Multi-Pin Test Harness Connector Cables -->
    <path d="M45 84 L45 105 L95 105 L95 145" stroke="#475569" stroke-width="1.4" />
    <path d="M132 82 L132 105 L115 105 L115 145" stroke="#E66826" stroke-width="1.4" stroke-dasharray="3 3" />
    
    <!-- Test Connector Blocks (Bottom) -->
    <rect x="88" y="145" width="34" height="12" rx="2" fill="#E2E8F0" stroke="#475569" />
    <circle cx="95" cy="151" r="1.5" fill="#475569" />
    <circle cx="105" cy="151" r="1.5" fill="#475569" />
    <circle cx="115" cy="151" r="1.5" fill="#475569" />

    <!-- Status PASS indicator -->
    <circle cx="172" cy="38" r="4" fill="#10B981" stroke="none" />
  </g>
</svg>